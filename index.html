<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Beverage Intelligence — Qose Bar Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen select-none">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-stone-900 text-white px-4 py-3 shadow-md flex items-center justify-between">
    <div>
      <h1 class="text-base font-bold tracking-tight">Beverage Intelligence</h1>
      <p class="text-[11px] text-amber-400 font-medium">Qose Bar Operations &amp; HPP</p>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="syncAllData(true)" id="syncStatusBadge" class="text-[11px] px-2.5 py-1 rounded-full bg-emerald-600/20 text-emerald-300 border border-emerald-500/40 font-semibold active:scale-95">
        ● Sync
      </button>
      <button onclick="openSettingsModal()" class="p-2 rounded-lg bg-stone-800 text-stone-300 hover:text-white active:scale-95" title="Pengaturan URL">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="mainContent" class="max-w-3xl mx-auto px-3 pt-3 pb-44">
    <div class="text-center py-16 text-stone-400 text-sm">Memuat sistem operasional bar...</div>
  </main>

  <!-- Reusable Modal -->
  <div id="modalOverlay" class="fixed inset-0 z-50 bg-black/60 hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="px-4 py-3 border-b border-stone-200 flex items-center justify-between bg-stone-50">
        <h3 id="modalTitle" class="font-bold text-sm text-stone-800">Form</h3>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-stone-200 text-stone-700 font-bold text-sm">✕</button>
      </div>
      <div id="modalBody" class="p-4 overflow-y-auto space-y-3 text-sm"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toastBox" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-full bg-stone-900 text-white text-xs font-semibold shadow-lg"></div>

  <!-- Bottom Navigation (Raised above Netlify badge) -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-stone-200 shadow-lg pb-14 pt-2 px-1">
    <div class="max-w-3xl mx-auto grid grid-cols-5 gap-1 text-center">
      <button onclick="switchTab('home')" data-tab="home" class="nav-btn flex flex-col items-center py-1 rounded-lg text-amber-700 font-bold">
        <span class="text-lg leading-none">🏠</span>
        <span class="text-[10px] mt-1">Home</span>
      </button>
      <button onclick="switchTab('daily')" data-tab="daily" class="nav-btn flex flex-col items-center py-1 rounded-lg text-stone-500">
        <span class="text-lg leading-none">📦</span>
        <span class="text-[10px] mt-1">Daily Inv</span>
      </button>
      <button onclick="switchTab('parstock')" data-tab="parstock" class="nav-btn flex flex-col items-center py-1 rounded-lg text-stone-500">
        <span class="text-lg leading-none">⚠️</span>
        <span class="text-[10px] mt-1">Par Stock</span>
      </button>
      <button onclick="switchTab('po')" data-tab="po" class="nav-btn flex flex-col items-center py-1 rounded-lg text-stone-500">
        <span class="text-lg leading-none">🛒</span>
        <span class="text-[10px] mt-1">PO &amp; Vendor</span>
      </button>
      <button onclick="switchTab('master')" data-tab="master" class="nav-btn flex flex-col items-center py-1 rounded-lg text-stone-500">
        <span class="text-lg leading-none">🧪</span>
        <span class="text-[10px] mt-1">Master &amp; HPP</span>
      </button>
    </div>
  </nav>

  <!-- Config & Modular Scripts -->
  <script src="config.js"></script>
  <script src="app-core.js"></script>
  <script src="app-inventory.js"></script>
  <script src="app-po-pdf.js"></script>
</body>
</html>
